<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Showcase</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- ===== NAVIGATION BAR (Top Center) ===== -->
  <nav class="nav-bar">
    <div class="nav-links">
      <a href="#" class="nav-link active"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="#" class="nav-link"><i class="fas fa-folder"></i> Projects</a>
      <a href="#" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
    </div>
  </nav>

  <!-- ===== PROFILE SECTION ===== -->
  <section class="profile-section">
    <div class="profile-header">
      <div class="profile-avatar-wrapper">
        <img src="https://i.pravatar.cc/150?img=28" alt="YewsWsi" class="profile-avatar" />
        <div class="status-badge online"></div>
      </div>
      <div class="profile-info">
        <h1 class="profile-name">YewsWsi</h1>
        <p class="profile-title">Creative Developer · Designer</p>
        <div class="tags-container">
          <span class="tag-badge"><i class="fas fa-code"></i> Developer</span>
          <span class="tag-badge"><i class="fas fa-pen-fancy"></i> Designer</span>
          <span class="tag-badge"><i class="fas fa-terminal"></i> Scripter</span>
          <span class="tag-badge"><i class="fas fa-rocket"></i> Creator</span>
        </div>
        <div class="profile-stats">
          <span><i class="fas fa-folder"></i> <span id="projectCount">0 projects</span></span>
          <span><i class="fas fa-star"></i> 5 showcases</span>
          <span><i class="fas fa-calendar"></i> 2025</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== TABS ===== -->
  <div class="tabs-container">
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="all"><i class="fas fa-th"></i> All</button>
      <button class="tab-btn" data-tab="fitness"><i class="fas fa-heart"></i> Fitness</button>
      <button class="tab-btn" data-tab="design"><i class="fas fa-palette"></i> Design</button>
      <button class="tab-btn" data-tab="agency"><i class="fas fa-building"></i> Agency</button>
      <button class="tab-btn" data-tab="analytics"><i class="fas fa-chart-line"></i> Analytics</button>
    </div>
  </div>

  <!-- ===== PROJECTS GRID ===== -->
  <div class="projects-section">
    <div class="scroll-list" id="showcaseList">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="glass-deep p-4 tilt-card no-tilt">
      <div class="tilt-content flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fas fa-gem text-xl text-gray-500"></i>
          <div>
            <p class="text-white font-medium text-sm">Made by YewsWsi</p>
            <p class="text-gray-400 text-xs">✦ Interactive Showcase ✦</p>
          </div>
        </div>
        <div class="social-icons">
          <a href="#" class="social-link"><i class="fab fa-github"></i></a>
          <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social-link"><i class="fab fa-dribbble"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <div class="h-2"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times"></i> Close</button>
    <div id="modalBody">
      <div class="flex items-center gap-3 mb-3">
        <div class="preview-icon no-tilt"><i class="fas fa-eye text-gray-400"></i></div>
        <div>
          <h3 class="text-white font-bold text-lg" id="modalTitle">Showcase</h3>
          <p class="text-gray-400 text-xs" id="modalSub">preview</p>
        </div>
      </div>
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
