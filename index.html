<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Showcase Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- Profile Header -->
  <div class="profile-header mb-5">
    <div class="flex items-center gap-4">
      <div class="avatar-wrapper">
        <div class="avatar-ring">
          <div class="avatar-large overflow-hidden">
            <img src="https://i.pravatar.cc/150?img=28" alt="YewsWsi" class="w-full h-full object-cover grayscale">
          </div>
        </div>
      </div>
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-white">YewsWsi</h1>
          <span class="verified-badge"><i class="fas fa-check-circle"></i></span>
        </div>
        <p class="text-gray-400 text-sm">Creative Developer & Designer</p>
        <div class="flex flex-wrap gap-1.5 mt-2">
          <span class="tag">Dev</span>
          <span class="tag">Scripter</span>
          <span class="tag">Designer</span>
          <span class="tag">UI/UX</span>
        </div>
      </div>
    </div>
    <div class="made-by mt-2">
      <span class="text-gray-500 text-[10px] tracking-wider"><i class="fas fa-code"></i> Made by YewsWsi</span>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row grid grid-cols-3 gap-2 mb-4">
    <div class="glass stat-card tilt-card">
      <div class="tilt-content text-center">
        <div class="stat-icon"><i class="fas fa-cube icon-gray"></i></div>
        <div class="stat-value" id="projectCount">5</div>
        <div class="stat-label">Projects</div>
      </div>
    </div>
    <div class="glass stat-card tilt-card">
      <div class="tilt-content text-center">
        <div class="stat-icon"><i class="fas fa-code icon-gray"></i></div>
        <div class="stat-value">12</div>
        <div class="stat-label">Scripts</div>
      </div>
    </div>
    <div class="glass stat-card tilt-card">
      <div class="tilt-content text-center">
        <div class="stat-icon"><i class="fas fa-star icon-gray"></i></div>
        <div class="stat-value">4.9</div>
        <div class="stat-label">Rating</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-container mb-3">
    <div class="flex gap-1">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="fitness">Fitness</button>
      <button class="tab-btn" data-tab="portfolio">Portfolio</button>
      <button class="tab-btn" data-tab="studio">Studio</button>
      <button class="tab-btn" data-tab="agency">Agency</button>
      <button class="tab-btn" data-tab="analytics">Analytics</button>
    </div>
  </div>

  <!-- Showcase Grid -->
  <div class="showcase-grid mb-4">
    <div class="scroll-list space-y-3" id="showcaseList">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <!-- Footer -->
  <div class="glass-deep p-4 tilt-card">
    <div class="tilt-content flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fas fa-github text-xl text-gray-500 no-tilt"></i>
        <div>
          <p class="text-white font-medium text-sm">GitHub Pages</p>
          <p class="text-gray-400 text-xs">hosted with ✦</p>
        </div>
      </div>
      <div class="flex gap-2">
        <span class="badge">glass</span>
        <span class="badge">tilt</span>
        <span class="badge">gsap</span>
        <span class="badge">anime</span>
      </div>
    </div>
  </div>

  <div class="h-2"></div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times mr-1"></i> Close</button>
    <div id="modalBody">
      <div class="flex items-center gap-3 mb-3">
        <div class="preview-icon no-tilt"><i class="fas fa-eye text-gray-400"></i></div>
        <div>
          <h3 class="text-white font-bold text-lg" id="modalTitle">Showcase</h3>
          <p class="text-gray-400 text-xs" id="modalSub">preview</p>
        </div>
      </div>
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
