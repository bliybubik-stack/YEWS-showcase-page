<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Developer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- Made By Badge -->
  <div class="text-center mb-3">
    <span class="text-[10px] text-gray-500 tracking-widest bg-white/5 px-4 py-1 rounded-full inline-block">
      <i class="fas fa-crown text-[8px] mr-1"></i> Made by: !YewsWsi
    </span>
  </div>

  <!-- Profile Section -->
  <div class="flex items-center gap-4 mb-5">
    <!-- Profile Icon - No Human Photo -->
    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-700 to-gray-600 border-2 border-gray-500 flex items-center justify-center avatar-icon flex-shrink-0">
      <i class="fas fa-code text-2xl text-gray-300"></i>
    </div>
    
    <div>
      <h1 class="text-2xl font-bold text-white tracking-tight">YewsWsi</h1>
      <p class="text-gray-400 text-sm flex items-center gap-2">
        <i class="fas fa-map-pin text-[10px] text-gray-500"></i>
        Creative Developer
      </p>
    </div>
  </div>

  <!-- Tags -->
  <div class="flex flex-wrap gap-2 mb-5">
    <span class="tag"><i class="fas fa-code text-[10px] mr-1"></i> Dev</span>
    <span class="tag"><i class="fas fa-terminal text-[10px] mr-1"></i> Scripter</span>
    <span class="tag"><i class="fas fa-pen-fancy text-[10px] mr-1"></i> Designer</span>
    <span class="tag"><i class="fas fa-cube text-[10px] mr-1"></i> Creator</span>
    <span class="tag"><i class="fas fa-rocket text-[10px] mr-1"></i> Innovator</span>
  </div>

  <!-- Projects Header -->
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-white font-bold text-sm flex items-center gap-2">
      <i class="fas fa-folder-open text-gray-400 text-xs"></i>
      Projects
    </h2>
    <span class="text-[10px] text-gray-500 bg-white/5 px-2 py-0.5 rounded-full">5 total</span>
  </div>

  <!-- Tabs / Filters -->
  <div class="flex flex-wrap gap-1 mb-4">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="fitness">Fitness</button>
    <button class="filter-btn" data-filter="portfolio">Portfolio</button>
    <button class="filter-btn" data-filter="studio">Studio</button>
    <button class="filter-btn" data-filter="agency">Agency</button>
    <button class="filter-btn" data-filter="analytics">Analytics</button>
  </div>

  <!-- Project List -->
  <div class="scroll-list space-y-3" id="showcaseList">
    <!-- Cards injected by JavaScript -->
  </div>

  <!-- Footer -->
  <div class="glass-deep p-4 mt-4 tilt-card">
    <div class="tilt-content flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fas fa-gem text-xl text-gray-500 no-tilt"></i>
        <div>
          <p class="text-white font-medium text-sm">Showcase Collection</p>
          <p class="text-gray-400 text-xs">Interactive glass gallery</p>
        </div>
      </div>
      <div class="flex gap-2">
        <span class="badge">glass</span>
        <span class="badge">tilt</span>
        <span class="badge">gsap</span>
      </div>
    </div>
  </div>

  <div class="h-2"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times mr-1"></i> Close</button>
    <div id="modalBody">
      <div class="flex items-center gap-3 mb-3">
        <div class="preview-icon no-tilt"><i class="fas fa-eye text-gray-400"></i></div>
        <div>
          <h3 class="text-white font-bold text-lg" id="modalTitle">Showcase</h3>
          <p class="text-gray-400 text-xs" id="modalSub">preview</p>
        </div>
      </div>
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
