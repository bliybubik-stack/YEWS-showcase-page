<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Showcase</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
  <!-- GSAP & Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- Status Bar -->
  <div class="flex justify-between items-center text-gray-400 text-sm font-semibold mb-4">
    <span class="tracking-wide"><i class="fas fa-gem mr-2 text-gray-500"></i>YewsWsi</span>
    <div class="flex items-center gap-3">
      <span class="text-[10px] tracking-widest opacity-60">✦✦✦✦✦</span>
      <div class="w-8 h-8 bg-gray-600 border border-gray-500 avatar overflow-hidden flex-shrink-0">
        <img src="https://i.pravatar.cc/100?img=28" alt="YewsWsi" class="w-full h-full object-cover grayscale">
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="mb-5">
    <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-2">
      Showcase
      <span class="text-sm font-normal text-gray-400 bg-white/5 px-3 py-0.5 rounded-full">v1–v5</span>
    </h1>
    <p class="text-gray-400 text-sm flex items-center gap-2 mt-1">
      <i class="fas fa-arrow-up text-xs text-gray-500"></i>
      Interactive glass gallery
    </p>
  </div>

  <!-- Showcase Grid -->
  <div class="mb-5">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-white font-bold text-sm flex items-center gap-2">
        <i class="fas fa-cube text-gray-400 text-xs"></i>
        All Showcases
      </h2>
      <span class="text-gray-500 text-[10px] flex items-center gap-1">
        <span class="status-dot online"></span> 5 projects
      </span>
    </div>

    <div class="scroll-list space-y-3" id="showcaseList">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <!-- Footer CTA -->
  <div class="glass-deep p-4 tilt-card">
    <div class="tilt-content flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fas fa-code text-xl text-gray-500 no-tilt"></i>
        <div>
          <p class="text-white font-medium text-sm">GitHub Pages</p>
          <p class="text-gray-400 text-xs">hosted with ✦</p>
        </div>
      </div>
      <div class="flex gap-2">
        <span class="badge">glass</span>
        <span class="badge">tilt</span>
        <span class="badge">gsap</span>
      </div>
    </div>
  </div>

  <div class="h-2"></div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times mr-1"></i> Close</button>
    <div id="modalBody">
      <div class="flex items-center gap-3 mb-3">
        <div class="preview-icon no-tilt"><i class="fas fa-eye text-gray-400"></i></div>
        <div>
          <h3 class="text-white font-bold text-lg" id="modalTitle">Showcase</h3>
          <p class="text-gray-400 text-xs" id="modalSub">preview</p>
        </div>
      </div>
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<!-- External JavaScript -->
<script src="app.js"></script>
</body>
</html>
