<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Developer Portfolio</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
  <!-- GSAP & Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="fas fa-cube"></i>
      </div>
      <span class="brand-name">YEWS</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-link active">
        <i class="fas fa-th-large"></i>
        <span>Showcase</span>
      </a>
      <a href="#" class="nav-link">
        <i class="fas fa-user"></i>
        <span>About</span>
      </a>
      <a href="#" class="nav-link">
        <i class="fas fa-code"></i>
        <span>Skills</span>
      </a>
      <a href="#" class="nav-link">
        <i class="fas fa-envelope"></i>
        <span>Contact</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-indicator">
        <span class="status-dot online"></span>
        <span class="status-text">Available</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Hero Section -->
    <section class="hero-section">
      <div class="hero-content">
        <div class="hero-badge">
          <span class="badge">✦ Portfolio</span>
          <span class="badge">2025</span>
        </div>
        <h1 class="hero-title">
          Showcase<br />
          <span class="hero-highlight">Collection</span>
        </h1>
        <p class="hero-subtitle">
          Interactive glassmorphism projects built with GSAP, Anime.js & Tailwind
        </p>
        <div class="hero-actions">
          <button class="btn-primary" id="viewAllBtn">
            <i class="fas fa-rocket"></i> View All Projects
          </button>
          <button class="btn-secondary">
            <i class="fas fa-github"></i> GitHub
          </button>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats-grid">
      <div class="stat-card glass">
        <div class="stat-icon"><i class="fas fa-folder-open"></i></div>
        <div class="stat-value" data-target="5">0</div>
        <div class="stat-label">Projects</div>
      </div>
      <div class="stat-card glass">
        <div class="stat-icon"><i class="fas fa-star"></i></div>
        <div class="stat-value" data-target="12">0</div>
        <div class="stat-label">Awards</div>
      </div>
      <div class="stat-card glass">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-value" data-target="28">0</div>
        <div class="stat-label">Clients</div>
      </div>
      <div class="stat-card glass">
        <div class="stat-icon"><i class="fas fa-code"></i></div>
        <div class="stat-value" data-target="47">0</div>
        <div class="stat-label">Projects</div>
      </div>
    </section>

    <!-- Tabs & Projects -->
    <section class="projects-section">
      <div class="tabs-container">
        <div class="tabs-header">
          <div class="tabs-buttons">
            <button class="tab-btn active" data-tab="all">
              <i class="fas fa-th"></i> All
            </button>
            <button class="tab-btn" data-tab="ui-ux">
              <i class="fas fa-paint-brush"></i> UI/UX
            </button>
            <button class="tab-btn" data-tab="web">
              <i class="fas fa-globe"></i> Web
            </button>
            <button class="tab-btn" data-tab="data">
              <i class="fas fa-chart-bar"></i> Data
            </button>
          </div>
          <span class="project-count" id="projectCount">5 projects</span>
        </div>

        <div class="tab-content active" id="tab-all">
          <div class="showcase-grid" id="showcaseList">
            <!-- Cards rendered by JavaScript -->
          </div>
        </div>

        <div class="tab-content" id="tab-ui-ux">
          <div class="showcase-grid" id="showcaseList-ui-ux">
            <!-- Filtered by JavaScript -->
          </div>
        </div>

        <div class="tab-content" id="tab-web">
          <div class="showcase-grid" id="showcaseList-web">
            <!-- Filtered by JavaScript -->
          </div>
        </div>

        <div class="tab-content" id="tab-data">
          <div class="showcase-grid" id="showcaseList-data">
            <!-- Filtered by JavaScript -->
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">
      <i class="fas fa-times"></i>
    </button>
    <div class="modal-header">
      <div class="modal-header-icon">
        <i class="fas fa-eye"></i>
      </div>
      <div>
        <h3 class="modal-title" id="modalTitle">Showcase</h3>
        <p class="modal-subtitle" id="modalSub">Preview</p>
      </div>
    </div>
    <div class="modal-body">
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<!-- External JavaScript -->
<script src="app.js"></script>
</body>
</html>
