<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Creative Developer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">22:48</span>
    <div class="status-icons">
      <span class="status-dot"></span>
      <span class="signal-bars">●●●●●</span>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-badge">✦ Made by YewsWsi</div>
    <h1 class="hero-title">YewsWsi</h1>
    <p class="hero-subtitle">Creative Developer</p>
    
    <div class="hero-tags">
      <span class="hero-tag"><i class="fas fa-code"></i> Dev</span>
      <span class="hero-tag"><i class="fas fa-terminal"></i> Scripter</span>
      <span class="hero-tag"><i class="fas fa-paint-brush"></i> Designer</span>
      <span class="hero-tag"><i class="fas fa-lightbulb"></i> Creator</span>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card glass tilt-card">
      <div class="tilt-content">
        <span class="stat-number">5</span>
        <span class="stat-label">Projects</span>
      </div>
    </div>
    <div class="stat-card glass tilt-card">
      <div class="tilt-content">
        <span class="stat-number">12</span>
        <span class="stat-label">Technologies</span>
      </div>
    </div>
    <div class="stat-card glass tilt-card">
      <div class="tilt-content">
        <span class="stat-number">100%</span>
        <span class="stat-label">Glass</span>
      </div>
    </div>
  </div>

  <!-- Projects Header -->
  <div class="projects-header">
    <div class="projects-title">
      <h2>Showcase Collection</h2>
      <span class="project-count">5 interactive projects</span>
    </div>
    <div class="projects-tags">
      <span class="glass-tag">glass</span>
      <span class="glass-tag">tilt</span>
      <span class="glass-tag">gsap</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-container">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="fitness">Fitness</button>
    <button class="tab-btn" data-tab="portfolio">Portfolio</button>
    <button class="tab-btn" data-tab="studio">Studio</button>
    <button class="tab-btn" data-tab="agency">Agency</button>
    <button class="tab-btn" data-tab="analytics">Analytics</button>
  </div>

  <!-- Project Grid -->
  <div class="project-grid" id="showcaseList">
    <!-- Cards injected by JavaScript -->
  </div>

  <!-- Footer -->
  <div class="footer-section glass-deep tilt-card">
    <div class="tilt-content footer-content">
      <div class="footer-brand">
        <i class="fas fa-gem"></i>
        <span>YewsWsi Studio</span>
      </div>
      <div class="footer-links">
        <a href="#" class="footer-link"><i class="fab fa-github"></i></a>
        <a href="#" class="footer-link"><i class="fab fa-twitter"></i></a>
        <a href="#" class="footer-link"><i class="fab fa-dribbble"></i></a>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times"></i> Close</button>
    <div class="modal-header">
      <div class="modal-icon"><i class="fas fa-eye"></i></div>
      <div>
        <h3 id="modalTitle">Showcase Preview</h3>
        <p id="modalSub">Interactive glass project</p>
      </div>
    </div>
    <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
