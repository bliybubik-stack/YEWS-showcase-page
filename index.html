<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Studio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      color: #f0f0f0;
    }

    /* ===== GLASS ===== */
    .glass {
      background: rgba(30, 30, 32, 0.35);
      backdrop-filter: blur(12px) saturate(0.8);
      -webkit-backdrop-filter: blur(12px) saturate(0.8);
      border: 1px solid rgba(200, 200, 200, 0.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      border-radius: 0.5rem;
      transition: box-shadow 0.2s ease;
    }

    .glass-deep {
      background: rgba(22, 22, 24, 0.5);
      backdrop-filter: blur(16px) saturate(0.6);
      -webkit-backdrop-filter: blur(16px) saturate(0.6);
      border: 1px solid rgba(180, 180, 180, 0.06);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      border-radius: 0.5rem;
    }

    /* ===== MAIN LAYOUT ===== */
    .app-container {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 1400px;
      min-height: 90vh;
      align-items: stretch;
    }

    /* LEFT: Dashboard */
    .dashboard-left {
      flex: 0 0 420px;
      max-width: 420px;
      background: rgba(16, 16, 18, 0.55);
      backdrop-filter: blur(18px) saturate(0.5);
      -webkit-backdrop-filter: blur(18px) saturate(0.5);
      border: 1px solid rgba(180, 180, 180, 0.05);
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      padding: 28px 24px;
      overflow-y: auto;
      max-height: 90vh;
    }

    /* RIGHT: Preview & Editor */
    .editor-right {
      flex: 1;
      min-width: 0;
      background: rgba(16, 16, 18, 0.55);
      backdrop-filter: blur(18px) saturate(0.5);
      -webkit-backdrop-filter: blur(18px) saturate(0.5);
      border: 1px solid rgba(180, 180, 180, 0.05);
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 90vh;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .editor-header .dots {
      display: flex;
      gap: 8px;
    }

    .editor-header .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
    }

    .editor-header .dots span:nth-child(1) { background: #ff5f57; }
    .editor-header .dots span:nth-child(2) { background: #ffbd2e; }
    .editor-header .dots span:nth-child(3) { background: #28c840; }

    .editor-header .editor-title {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .editor-header .editor-title span {
      color: #888;
    }

    .editor-preview {
      flex: 1;
      min-height: 0;
      background: #0b0b0b;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      overflow: hidden;
      position: relative;
    }

    .editor-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0b0b0b;
    }

    .editor-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      gap: 12px;
    }

    .editor-empty i {
      font-size: 48px;
      color: #333;
    }

    .editor-empty p {
      font-size: 14px;
      color: #555;
    }

    .editor-empty .hint {
      font-size: 12px;
      color: #3a3a3a;
    }

    /* ===== SCROLLBAR ===== */
    .dashboard-left::-webkit-scrollbar,
    .editor-right::-webkit-scrollbar {
      width: 3px;
    }

    .dashboard-left::-webkit-scrollbar-track,
    .editor-right::-webkit-scrollbar-track {
      background: transparent;
    }

    .dashboard-left::-webkit-scrollbar-thumb,
    .editor-right::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .dashboard-left {
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }

    /* ===== DASHBOARD STYLES ===== */

    /* Status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .status-bar .dots-menu {
      display: flex;
      gap: 4px;
      cursor: pointer;
    }

    .status-bar .dots-menu span {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #555;
    }

    .status-bar .status-time {
      color: #555;
      font-size: 12px;
    }

    /* Profile */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(1);
    }

    .profile-info h2 {
      font-size: 20px;
      font-weight: 700;
      color: #f0f0f0;
      margin: 0;
    }

    .profile-info .handle {
      font-size: 12px;
      color: #666;
      margin: 2px 0 6px 0;
    }

    .profile-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .profile-tag {
      padding: 2px 10px;
      border-radius: 0.5rem;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #888;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-card {
      text-align: center;
      padding: 12px 4px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stat-card .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #f0f0f0;
    }

    .stat-card .stat-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-top: 2px;
    }

    /* Projects list */
    .projects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .projects-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #f0f0f0;
    }

    .projects-header .project-count {
      font-size: 10px;
      color: #555;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .project-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.06);
      transform: translateX(4px);
    }

    .project-item .project-icon {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .project-item .project-icon i {
      color: #666;
      font-size: 14px;
    }

    .project-item .project-info {
      flex: 1;
      min-width: 0;
    }

    .project-item .project-info .title {
      font-size: 13px;
      font-weight: 500;
      color: #f0f0f0;
    }

    .project-item .project-info .subtitle {
      font-size: 10px;
      color: #555;
    }

    .project-item .project-badge {
      font-size: 8px;
      padding: 2px 8px;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .made-by {
      text-align: center;
      padding: 16px 0 4px 0;
      font-size: 11px;
      color: #333;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      margin-top: 16px;
    }

    .made-by span {
      color: #444;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .app-container {
        flex-direction: column;
        max-width: 640px;
      }

      .dashboard-left {
        flex: none;
        max-width: 100%;
        max-height: none;
      }

      .editor-right {
        max-height: 600px;
        min-height: 400px;
      }

      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .dashboard-left {
        padding: 16px;
      }

      .editor-right {
        padding: 16px;
        min-height: 300px;
      }

      .profile-section {
        flex-direction: column;
        text-align: center;
      }

      .profile-tags {
        justify-content: center;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .project-item {
        padding: 10px 12px;
      }
    }

    /* Tilt cards */
    .tilt-card {
      transform-style: preserve-3d;
      will-change: transform;
      transition: box-shadow 0.2s ease;
      cursor: default;
      border-radius: 0.5rem;
    }

    .tilt-card .tilt-content {
      transform-style: preserve-3d;
      will-change: transform;
      backface-visibility: hidden;
    }

    .tilt-card .no-tilt {
      transform: translateZ(0) !important;
      backface-visibility: hidden;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ===== LEFT: DASHBOARD ===== -->
  <div class="dashboard-left" id="dashboard">

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="dots-menu">
        <span></span><span></span><span></span>
      </div>
      <span class="status-time">✦ YewsWsi</span>
    </div>

    <!-- Profile -->
    <div class="profile-section">
      <div class="profile-avatar">
        <img src="https://i.pravatar.cc/150?img=28" alt="YewsWsi" />
      </div>
      <div class="profile-info">
        <h2>YewsWsi</h2>
        <p class="handle">@yewswsi · Creative Developer</p>
        <div class="profile-tags">
          <span class="profile-tag"><i class="fas fa-code mr-1"></i>Dev</span>
          <span class="profile-tag"><i class="fas fa-pen-fancy mr-1"></i>Designer</span>
          <span class="profile-tag"><i class="fas fa-cog mr-1"></i>Creator</span>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">5</div>
        <div class="stat-label">Projects</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Clients</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Awards</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">3</div>
        <div class="stat-label">Years</div>
      </div>
    </div>

    <!-- Projects -->
    <div class="projects-header">
      <h2><i class="fas fa-cube mr-2" style="color:#444;font-size:12px;"></i>Showcases</h2>
      <span class="project-count">5 projects</span>
    </div>

    <div class="project-list" id="projectList">
      <!-- Injected by JS -->
    </div>

    <!-- Made By -->
    <div class="made-by">
      Everything made by <span>YewsWsi</span> ✦
    </div>
  </div>

  <!-- ===== RIGHT: EDITOR / PREVIEW ===== -->
  <div class="editor-right">
    <div class="editor-header">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <div class="editor-title">
        <span>preview</span> · showcase
      </div>
      <div style="width:52px;"></div>
    </div>

    <div class="editor-preview" id="previewContainer">
      <div class="editor-empty" id="emptyState">
        <i class="fas fa-phone"></i>
        <p>Select a project to preview</p>
        <span class="hint">click any showcase on the left</span>
      </div>
      <iframe id="previewIframe" style="display:none;width:100%;height:100%;border:none;background:#0b0b0b;" frameborder="0"></iframe>
    </div>
  </div>

</div>

<script>
  (function() {
    'use strict';

    // ===== SHOWCASE DATA =====
    const showcases = [
      {
        id: 'v1',
        title: 'Showcase V1',
        subtitle: 'Fitness · Tilt + Tabs',
        file: 'showcases/showcase-v1.html',
        icon: 'fa-dumbbell',
        badge: 'v1'
      },
      {
        id: 'v2',
        title: 'Showcase V2',
        subtitle: 'Portfolio · Glass',
        file: 'showcases/showcase-v2.html',
        icon: 'fa-user-astronaut',
        badge: 'v2'
      },
      {
        id: 'v3',
        title: 'Showcase V3',
        subtitle: 'Studio · Services',
        file: 'showcases/showcase-v3.html',
        icon: 'fa-palette',
        badge: 'v3'
      },
      {
        id: 'v4',
        title: 'Showcase V4',
        subtitle: 'Agency · Portfolio',
        file: 'showcases/showcase-v4.html',
        icon: 'fa-building',
        badge: 'v4'
      },
      {
        id: 'v5',
        title: 'Showcase V5',
        subtitle: 'Analytics · Products',
        file: 'showcases/showcase-v5.html',
        icon: 'fa-chart-simple',
        badge: 'v5'
      }
    ];

    // ===== DOM ELEMENTS =====
    const projectList = document.getElementById('projectList');
    const previewIframe = document.getElementById('previewIframe');
    const emptyState = document.getElementById('emptyState');

    // ===== RENDER PROJECTS =====
    function renderProjects() {
      projectList.innerHTML = '';

      showcases.forEach((item) => {
        const el = document.createElement('div');
        el.className = 'project-item tilt-card';
        el.dataset.file = item.file;

        el.innerHTML = `
          <div class="tilt-content" style="display:flex;align-items:center;gap:12px;width:100%;">
            <div class="project-icon no-tilt">
              <i class="fas ${item.icon}"></i>
            </div>
            <div class="project-info">
              <div class="title">${item.title}</div>
              <div class="subtitle">${item.subtitle}</div>
            </div>
            <span class="project-badge">${item.badge}</span>
          </div>
        `;

        el.addEventListener('click', function() {
          const file = this.dataset.file;
          openPreview(file);
        });

        projectList.appendChild(el);
      });

      // Tilt init
      setTimeout(initTilt, 50);
    }

    // ===== OPEN PREVIEW =====
    function openPreview(file) {
      emptyState.style.display = 'none';
      previewIframe.style.display = 'block';
      previewIframe.src = file;

      // Highlight active project
      document.querySelectorAll('.project-item').forEach(el => {
        el.style.borderColor = 'rgba(255,255,255,0.03)';
        el.style.background = 'rgba(255,255,255,0.02)';
      });

      document.querySelectorAll('.project-item').forEach(el => {
        if (el.dataset.file === file) {
          el.style.borderColor = 'rgba(255,255,255,0.12)';
          el.style.background = 'rgba(255,255,255,0.05)';
        }
      });
    }

    // ===== TILT EFFECT =====
    function initTilt() {
      const tiltCards = document.querySelectorAll('.tilt-card');
      const MAX_TILT = 3.5;

      tiltCards.forEach(card => {
        if (card._tiltAttached) return;
        card._tiltAttached = true;

        let currentRotX = 0, currentRotY = 0;
        let targetRotX = 0, targetRotY = 0;
        let isHovering = false;

        card.addEventListener('mouseenter', () => { isHovering = true; });
        card.addEventListener('mouseleave', () => {
          isHovering = false;
          targetRotX = 0;
          targetRotY = 0;
        });

        card.addEventListener('mousemove', (e) => {
          if (!isHovering) return;
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          targetRotY = (x - 0.5) * 2 * MAX_TILT;
          targetRotX = (y - 0.5) * 2 * MAX_TILT;
        });

        function animateTilt() {
          if (!isHovering) {
            currentRotX += (0 - currentRotX) * 0.08;
            currentRotY += (0 - currentRotY) * 0.08;
          } else {
            currentRotX += (targetRotX - currentRotX) * 0.12;
            currentRotY += (targetRotY - currentRotY) * 0.12;
          }

          gsap.set(card, {
            rotateX: currentRotX,
            rotateY: currentRotY,
            transformPerspective: 600,
            duration: 0.01,
            overwrite: 'auto'
          });

          requestAnimationFrame(animateTilt);
        }

        animateTilt();
      });
    }

    // ===== ENTRANCE =====
    function entranceAnim() {
      gsap.from('.dashboard-left', {
        opacity: 0,
        x: -20,
        duration: 0.7,
        ease: 'power3.out'
      });

      gsap.from('.editor-right', {
        opacity: 0,
        x: 20,
        duration: 0.7,
        delay: 0.1,
        ease: 'power3.out'
      });

      gsap.from('.project-item', {
        opacity: 0,
        y: 10,
        stagger: 0.06,
        duration: 0.5,
        delay: 0.2,
        ease: 'power2.out'
      });

      gsap.from('.profile-avatar', {
        rotation: -5,
        scale: 0.9,
        opacity: 0,
        duration: 0.7,
        delay: 0.3,
        ease: 'back.out(1.4)'
      });
    }

    // ===== INIT =====
    renderProjects();
    entranceAnim();
    setTimeout(initTilt, 200);

  })();
</script>

</body>
</html>
