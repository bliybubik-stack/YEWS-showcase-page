<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YewsWsi · Developer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="phone-glass" id="app">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="tracking-wide"><i class="fas fa-code mr-2 text-gray-500"></i>YewsWsi</span>
    <div class="flex items-center gap-3">
      <span class="text-[10px] tracking-widest opacity-60">✦✦✦✦✦</span>
      <div class="status-dot online"></div>
    </div>
  </div>

  <!-- Profile Section -->
  <div class="profile-section">
    <div class="profile-header">
      <div class="profile-icon no-tilt">
        <i class="fas fa-terminal"></i>
      </div>
      <div class="profile-info">
        <h1 class="text-3xl font-bold text-white tracking-tight">YewsWsi</h1>
        <p class="text-gray-400 text-sm">Developer · Scripter · Designer</p>
      </div>
    </div>
    
    <div class="badge-group">
      <span class="badge"><i class="fas fa-code mr-1"></i> Dev</span>
      <span class="badge"><i class="fas fa-terminal mr-1"></i> Scripter</span>
      <span class="badge"><i class="fas fa-paint-brush mr-1"></i> Designer</span>
      <span class="badge"><i class="fas fa-mobile-alt mr-1"></i> UI/UX</span>
    </div>

    <div class="bio-text">
      <p class="text-gray-400 text-sm">Building interactive experiences with glassmorphism, motion, and clean code.</p>
    </div>
  </div>

  <!-- Projects Section -->
  <div class="projects-section">
    <div class="section-header">
      <h2 class="text-white font-bold text-sm flex items-center gap-2">
        <i class="fas fa-cube text-gray-400 text-xs"></i>
        Projects
        <span class="text-gray-500 text-xs font-normal ml-1" id="projectCount">5</span>
      </h2>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="web">Web</button>
      <button class="tab-btn" data-tab="design">Design</button>
      <button class="tab-btn" data-tab="motion">Motion</button>
    </div>

    <!-- Project List -->
    <div class="scroll-list space-y-3" id="showcaseList">
      <!-- Cards injected by JavaScript -->
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-section glass-deep p-4 tilt-card">
    <div class="tilt-content flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fas fa-gem text-xl text-gray-500 no-tilt"></i>
        <div>
          <p class="text-white font-medium text-sm">Made by YewsWsi</p>
          <p class="text-gray-400 text-xs">✦ 2024 · All showcases</p>
        </div>
      </div>
      <div class="flex gap-2">
        <span class="badge">glass</span>
        <span class="badge">tilt</span>
        <span class="badge">gsap</span>
      </div>
    </div>
  </div>

  <div class="h-2"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose"><i class="fas fa-times mr-1"></i> Close</button>
    <div id="modalBody">
      <div class="flex items-center gap-3 mb-3">
        <div class="preview-icon no-tilt"><i class="fas fa-eye text-gray-400"></i></div>
        <div>
          <h3 class="text-white font-bold text-lg" id="modalTitle">Project</h3>
          <p class="text-gray-400 text-xs" id="modalSub">preview</p>
        </div>
      </div>
      <iframe id="modalIframe" src="" frameborder="0" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
